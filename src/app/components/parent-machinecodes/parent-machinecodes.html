<div class="container">

    <h1>Shopping Cart (Parent Component)</h1>

    <button (click)="addProduct()">
        Add Product
    </button>

    <button (click)="loadSavedCart()">
        Load Saved Cart
    </button>

    <button (click)="clearCart()">
        Clear Cart
    </button>

    <hr>

    <h3>Parent Cart</h3>

    <table border="1" cellpadding="10">

        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
        </tr>

        <tr *ngFor="let item of cart">

            <td>{{item.name}}</td>
            <td>₹{{item.price}}</td>
            <td>{{item.quantity}}</td>

        </tr>

    </table>

    <br>

    <!-- Child Component -->

    <app-child-machinecodes [cartItems]="cart"></app-child-machinecodes>

</div>

<div class="page">

    <div class="code-tabs-container">
    <div class="code-tabs-header">
        <button type="button" class="code-tab-button" 
                *ngFor="let item of parentArray" 
                [class.active]="setIndex == item.index" 
                (click)="setDataIndex(item.index)">
            {{item.index}}
        </button>
    </div>
    <ng-container *ngFor="let item of parentArray">
        <pre class="code-tab-content" *ngIf="setIndex == item.index">{{item.data}}</pre>
    </ng-container>
</div>
</div>
